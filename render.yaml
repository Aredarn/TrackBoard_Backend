# Render Blueprint: the TrackBoard API as one free Docker web service.
# The database is Supabase (AWS eu-west-1), so the service runs in Frankfurt to stay close to it.
services:
  - type: web
    name: trackboard
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Liveness only: /health/ready also probes the database, and a Supabase blip should not
    # fail a deploy of an otherwise healthy build.
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Render routes to $PORT; the image listens on 8080 (ASPNETCORE_URLS in the Dockerfile).
      - key: PORT
        value: "8080"
      # Render's proxy terminates TLS. Without this every request looks like it comes from
      # the proxy over http: rate limits would be shared by all clients, and HTTPS
      # redirection would see the wrong scheme.
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      # Supabase session pooler (port 5432). Entered in the Render dashboard, never committed.
      - key: ConnectionStrings__Default
        sync: false
      # 256-bit random value generated by Render on first deploy.
      - key: Jwt__Secret
        generateValue: true
      # Photo storage (optional). Without the URL and key the API runs and the photo
      # endpoints answer 503. The bucket must exist and be public; paths carry random ids.
      - key: Supabase__Url
        sync: false
      # Service-role key: bypasses RLS, server-side only, never shipped to the app.
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: Supabase__MediaBucket
        value: trackboard-media
      # Vehicle catalogue (optional): an API Ninjas key for the app's make/model/year lookup.
      # Without it those endpoints answer 503 and the app's car form is filled in by hand.
      - key: VehicleSpecs__ApiKey
        sync: false
      # "true" only on a plan that includes /v2/cars (Developer and up): full car spec sheets
      # instead of the free tier's fuel/gearbox/drive/cylinder facets.
      - key: VehicleSpecs__CarDetails
        value: "false"
      # The TrackBoard web app's origin (the TrackBoard-Web static site), e.g.
      # https://trackboard-web.onrender.com. Set in the dashboard once the site exists; without
      # it browsers get no CORS grant and the web app cannot call the API.
      - key: Cors__AllowedOrigins__0
        sync: false
